# fd-wire-web — prod (fd-prod)
# 柏讯门面脸：官网/控制台静态面（nginx on :8080，非 root，SPA fallback
# 见镜像内 nginx.conf）。对外：NodePort ← cheap-1 SafeLine→Caddy→tailscale
# （wire.finddatatech.cloud，wanxing-web 同法）；/mcp 由 Caddy 直接反代
# registry，不经本 Service（见 ingress.yaml 头注）。
# 镜像 tag 待首次 GHA 构建后回填（TODO(go-live)）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-wire-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-wire-web
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1  # fd-prod compute-quota cpu limits 已满（7900m/8）：v1 单副本轻档，扩容前先调配额
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-wire-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-wire-web
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: web
          # TODO(go-live): 首次构建后回填实际 sha- tag。
          # 出片 tag=testaction001 build-pool 快照 sha=55ba5b3（真 6eb3ace：HomeView 商留站内表单卡（mailto 占位退役）+admin contacts 分区，add-contact-intake；内容门过= bundle home.contact:1/contacts:3）。
          # 出片 tag=testaction001 build-pool 快照 sha=f3feb66（真 72e15be：/public/ 补 404 纪律
          # ——未命中的静态路径不再回 200 的 index.html。此前 /public/copilot.js 线上实测
          # 200 text/html，`<script src>` 收到 HTML 即静默死；/assets/ 那条是同一缺陷的另一面，
          # 早已修过。本机 nginx 沙箱红证：加规则前 200→加规则后 404，而 / 与 /console/ 的
          # SPA 回落、/assets/ 真实产物零漂移）。
          # 出片 tag=testaction001 build-pool 快照 sha=be985e7（真 baf1d03：根上的脚本路径不再回
          # 200 的 index.html——补按扩展名的 404 正则，扩展名不含 json/txt 以免抢 /internal/ 反代；
          # 因正则优先于普通前缀 location，同时给 ^~ /console 与 ^~ /internal/ 加保护。
          # 此前线上 /copilot.js = 200 text/html 417B（index.html 指纹），六台主机并排只有 wire 这样）。
          image: ccr.ccs.tencentyun.com/fd-wire/web:sha-4792f67 #｜2026-11-17 sha-4792f67：副驾宿主钩子（harden-copilot-ask-and-intent 4.2/4.3）——context() 递 location.hash（本 app 是 hash 路由）+ hashchange 时 pushContext；navigate 白名单用 parseHash 反查，拒绝回落成 home 的未知路由与站外 URL。注：柏讯专家的 persona 是产品线客服角色，未含 intent 协议，所以这些钩子当前不会被调用（先装好，等 persona 补齐后即可生效）。源 4ae67e2+…（run 43900714381 绿）；回滚=sha-61d7d93
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          env:
            # admin 第二道闸的服务端注入源（wire-self-serve-launch 5.2 附带）：
            # nginx envsubst 模板把它渲染进 /internal/ 反代的
            # proxy_set_header X-Admin-Token——值只存在容器 env，永不下发浏览器。
            # 复用既有 fd-wire-env Secret 键（与 fd-wire-api 同源，轮换同步滚动）。
            - name: FD_WIRE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: fd-wire-env, key: fd_wire_admin_token }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-wire-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-wire-web
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-wire-web
  ports:
    - name: http
      port: 80
      targetPort: http
      # TODO(go-live): 台账先行——先在 fd-infra-deploy PORTS.md 登记再定值。
      # 31882 系当前空档推定（wanxing-web 已占 31880），主代理核对台账后
      # 如有冲突改此处并同步 PORTS.md（冻结端口见台账第 2 节）。
      nodePort: 31882
